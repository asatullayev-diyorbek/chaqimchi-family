<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChaqimchiAI Child — Holat</title>
  <link rel="stylesheet" href="assets/fonts.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="assets/app.css">
  <script src="assets/icons.js" defer></script>
  <script src="assets/bridge.js" defer></script>
</head>
<body class="tray">
  <main class="shell">
    <section class="card status-window">
      <div class="window-head">
        <div class="mini"><span><iconify-icon icon="solar:heart-angle-bold-duotone"></iconify-icon></span>ChaqimchiAI Child</div>
      </div>
      <div class="greeting">
        <div><b data-bind="greeting">Salom! 👋</b><small data-bind="substate">Bugun yaxshi ketayapti.</small></div>
        <iconify-icon icon="solar:sun-2-bold-duotone" id="mood"></iconify-icon>
      </div>
      <div class="time-block">
        <div class="time-meta"><span>Bugungi ekran vaqting</span><iconify-icon icon="solar:clock-circle-bold-duotone"></iconify-icon></div>
        <strong data-bind="today_label">0 daq</strong>
        <div class="progress"><span data-bind-width="progress_pct"></span></div>
        <div class="time-foot"><span data-bind="limit_label">Kunlik limit belgilanmagan</span><b data-bind="remaining_label"></b></div>
      </div>
      <button class="info-link" style="border:0;background:none;width:100%;cursor:pointer;font:inherit" onclick="ui.action('privacy')">
        <span><iconify-icon icon="solar:eye-bold-duotone"></iconify-icon></span>
        <div><b>Ota-onam nimani ko‘radi?</b><small>Bu yerda hammasi ochiq tushuntirilgan</small></div>
        <iconify-icon icon="solar:alt-arrow-right-linear"></iconify-icon>
      </button>
    </section>
  </main>
  <script>
    ui.onState(function (s) {
      var mood = document.getElementById('mood');
      if (s.state === 'offline') mood.setAttribute('icon', 'solar:wifi-router-minimalistic-linear');
      else if (s.state === 'warn') mood.setAttribute('icon', 'solar:danger-triangle-linear');
      else mood.setAttribute('icon', 'solar:sun-2-bold-duotone');
    });
  </script>
</body>
</html>
