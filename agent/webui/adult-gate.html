<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChaqimchiAI Child — Kattalar uchun</title>
  <link rel="stylesheet" href="assets/fonts.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="assets/app.css">
  <script src="assets/icons.js" defer></script>
  <script src="assets/bridge.js" defer></script>
  <style>
    body { display:grid; place-items:center; }
    .panel { width:min(440px,calc(100% - 48px)); padding:36px; text-align:center;
      border:1px solid rgba(255,255,255,.9); border-radius:28px;
      background:rgba(255,255,255,.8); box-shadow:var(--shadow); }
    .panel .sym { display:grid; place-items:center; width:78px; height:78px; margin:0 auto 16px;
      border-radius:24px; background:#e3f2fd; color:#2563eb; font-size:38px; }
    .panel h1 { margin:0 0 10px; font-size:20px; }
    .panel p { margin:0 0 24px; color:#617b91; font-size:13px; line-height:1.65; }
    .panel .actions { display:flex; gap:10px; justify-content:center; margin-top:0; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="sym"><iconify-icon icon="solar:shield-check-bold-duotone"></iconify-icon></div>
    <h1>Bu bo‘lim ota-onaga bildiriladi</h1>
    <p>Bu panel faqat ota-ona uchun. Ochilishi ota-ona paneliga va Telegram orqali xabar sifatida yuboriladi — bu shaffoflik uchun ataylab shunday.<br><br>Davom etasizmi?</p>
    <div class="actions">
      <button class="btn outline" onclick="ui.action('cancel')">Bekor qilish</button>
      <button class="btn primary" onclick="ui.action('continue')">Davom etish</button>
    </div>
  </div>
</body>
</html>
