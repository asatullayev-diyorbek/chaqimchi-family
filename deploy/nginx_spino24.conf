map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # api.guard.spino24.uz is the real production hostname (DNS -> this
    # VPS); "_" is kept as a catch-all default so the bare IP or any other
    # hostname pointed here still gets served instead of a connection
    # reset, and so certbot's HTTP-01 challenge matches regardless of
    # which Host header the request arrives with.
    server_name api.guard.spino24.uz _;

    client_max_body_size 20M;

    location /static/ {
        alias /opt/spino24/app/server/staticfiles/;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Channels)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.guard.spino24.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.guard.spino24.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = api.guard.spino24.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name api.guard.spino24.uz _;
    return 404; # managed by Certbot


}