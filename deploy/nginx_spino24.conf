map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Shared proxy behavior for every hostname pointed at this VPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name apiguard.spino24.uz api.guard.spino24.uz _;

    # Let's Encrypt HTTP-01 challenges must be served in plain HTTP even
    # for hostnames that otherwise redirect to HTTPS below.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name apiguard.spino24.uz;

    ssl_certificate /etc/letsencrypt/live/apiguard.spino24.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apiguard.spino24.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location /static/ {
        alias /opt/spino24/app/server/staticfiles/;
    }

    # Windows installer/agent builds. Nginx serves these directly (no
    # Django/Daphne in the path) so a big binary streams at the VPS's own
    # network speed instead of being pushed through the ASGI app server —
    # parent-web used to serve these itself from Vercel, which was slow
    # from Uzbekistan; parent-web now just links here.
    location /downloads/ {
        alias /opt/spino24/downloads/;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Channels)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# api.guard.spino24.uz is kept alive (same backend) only because it may
# still be cached/bookmarked from the brief period it was the primary
# hostname; apiguard.spino24.uz (single-label, matches Cloudflare's free
# *.spino24.uz Universal SSL) is the real production hostname going
# forward — see docs/current_tasks.md.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.guard.spino24.uz;

    ssl_certificate /etc/letsencrypt/live/api.guard.spino24.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.guard.spino24.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location /static/ {
        alias /opt/spino24/app/server/staticfiles/;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
